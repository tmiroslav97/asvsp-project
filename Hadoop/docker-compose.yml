name: hadoop

x-hadoop: &hadoop
  image: asvsp-project-hadoop:3.5.0
  build: .
  networks:
    - asvsp-project

x-datanode-health: &datanode-health
  healthcheck:
    test: ["CMD-SHELL", "hdfs dfsadmin -report | grep -q 'Live datanodes (2)'"]
    interval: 5s
    timeout: 10s
    retries: 30

networks:
  asvsp-project:
    name: asvsp-project
    external: true

services:
  namenode:
    <<: *hadoop
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - ./data:/data
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name/current
    healthcheck:
      test: ["CMD-SHELL", "nc -z namenode 9000"]
      interval: 5s
      timeout: 10s
      retries: 30

  datanode1:
    <<: [*hadoop, *datanode-health]
    container_name: datanode1
    hostname: datanode1
    command: ["hdfs", "datanode"]
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy

  datanode2:
    <<: [*hadoop, *datanode-health]
    container_name: datanode2
    hostname: datanode2
    command: ["hdfs", "datanode"]
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy

  historyserver:
    <<: *hadoop
    container_name: historyserver
    hostname: historyserver
    command: ["yarn", "timelineserver"]
    ports:
      - "8188:8188"
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    depends_on:
      namenode:
        condition: service_healthy
      datanode1:
        condition: service_healthy

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hadoop_historyserver:
